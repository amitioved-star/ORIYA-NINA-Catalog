<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C9A55A" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ORIYA NINA - ניהול</title>

    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/admin.webmanifest" />

    <!-- No auto-redirect here on purpose: iOS "Add to Home Screen" reads the URL of the page
         you're actually standing on, and an instant redirect moves you onto the storefront's
         index.html (which links the main site.webmanifest, start_url "/") before you get a
         chance to tap Share. Staying put keeps this page's own manifest in effect. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ניהול ORIYA" />

    <style>
      body {
        font-family: -apple-system, 'Assistant', sans-serif;
        background: linear-gradient(135deg, #FAF5EB 0%, #F5ECD6 100%);
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: white;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        padding: 40px 32px;
        text-align: center;
        max-width: 320px;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 20px;
        color: #2f2924;
        margin: 0 0 4px;
      }
      p {
        color: #9c8f7f;
        font-size: 14px;
        margin: 0 0 24px;
      }
      a.enter {
        display: inline-block;
        background: linear-gradient(135deg, #C9A55A, #8a6d2e);
        color: white;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
        padding: 14px 32px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo.png" alt="ORIYA NINA" />
      <h1>ORIYA NINA</h1>
      <p>לוח ניהול הקטלוג</p>
      <a class="enter" href="/admin">כניסה לניהול</a>
    </div>
  </body>
</html>
